<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/logo-i.svg">
<title>I tuoi dati per la fattura</title>
<link rel="stylesheet" href="app.css?v=2">
<style>body{padding-top:0}#box{min-height:100vh;display:grid;place-items:center;padding:24px}#box .card{width:min(460px,100%)}#box img{width:64px;height:64px;border-radius:20px;background:#fff;padding:7px;display:block;margin:0 auto 10px}h1{font-size:1.5rem;text-align:center}.ok{text-align:center;font-size:3rem}</style>
</head>
<body>
<div id="box"><div class="card glass" id="c"><img src="/img/logo-i.svg" alt=""><div style="text-align:center"><span class="spin"></span></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
(function(){
var sb=supabase.createClient("https://afdpxhzxhfeumtjtfvui.supabase.co","sb_publishable_PlEfnhOIIYzjwciVxKUnSA_wSwMy-7o",{auth:{persistSession:false}});
var c=document.getElementById("c"),t=new URLSearchParams(location.search).get("t")||"";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(x){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]})}
function cfOk(cf){return /^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$/.test(cf)}
var IMG='<img src="/img/logo-i.svg" alt="">';
sb.rpc("scheda_info",{p_token:t}).then(function(r){var d=r.data;
  if(!d||!d.ok){c.innerHTML=IMG+'<h1>Link non valido</h1><p class="sub" style="text-align:center">Questo link non è più attivo. Scrivi su WhatsApp per riceverne uno nuovo.</p>';return}
  c.innerHTML=IMG+'<h1>Ciao '+esc(d.nome)+'</h1><p class="sub" style="text-align:center">Per la fattura della visita del <b>'+esc(d.quando)+'</b>'+(d.sede?' a '+esc(d.sede):'')+' servono il tuo codice fiscale e l’indirizzo di residenza.'+(d.compilata?'<br><b>Li hai già inseriti: puoi correggerli qui.</b>':'')+'</p>'+
    '<form id="f"><label>Codice fiscale</label><input id="cf" autocapitalize="characters" autocomplete="off" required style="text-transform:uppercase">'+
    '<label>Indirizzo di residenza</label><input id="ind" autocomplete="street-address" required placeholder="Via e numero civico">'+
    '<div class="row3"><div><label>Città</label><input id="citta" autocomplete="address-level2" required></div><div><label>CAP</label><input id="cap" inputmode="numeric" maxlength="5" autocomplete="postal-code" required></div><div><label>Prov.</label><input id="prov" maxlength="2" style="text-transform:uppercase"></div></div>'+
    '<p class="sub" style="font-size:.8rem;margin-top:12px">I dati servono solo per emettere la fattura e restano riservati.</p><div class="hint" id="m"></div><button class="btn block" style="margin-top:12px">Invia</button></form>';
  document.getElementById("f").onsubmit=function(e){e.preventDefault();var g=function(i){return document.getElementById(i).value.trim()},cf=g("cf").toUpperCase().replace(/\s/g,""),m=document.getElementById("m");
    if(!cfOk(cf)){m.className="hint err";m.textContent="Il codice fiscale non sembra corretto: controllalo.";return}
    if(!/^\d{5}$/.test(g("cap"))){m.className="hint err";m.textContent="Il CAP deve avere 5 cifre.";return}
    sb.rpc("scheda_salva",{p_token:t,p:{cf:cf,indirizzo:g("ind"),cap:g("cap"),citta:g("citta"),prov:g("prov")}}).then(function(x){
      if(!x.data||!x.data.ok){m.className="hint err";m.textContent="Non è stato possibile salvare: controlla i dati e riprova.";return}
      c.innerHTML=IMG+'<div class="ok">✅</div><h1>Grazie!</h1><p class="sub" style="text-align:center">I tuoi dati sono arrivati. A presto! 🌿</p>'})}})})();
</script>
</body>
</html>
