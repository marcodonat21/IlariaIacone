:root{--red:#B62432;--green:#809E84;--text:#1f2523;--muted:#68706c;--line:#e6e8e4;--bg:#f6f7f5;--accs:#fbeef0;--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.82);--gbd:rgba(255,255,255,.75);--gsh:0 1px 0 rgba(255,255,255,.9) inset,0 12px 32px -16px rgba(31,37,35,.25),0 1px 3px rgba(31,37,35,.05);--blur:saturate(180%) blur(18px);--ok:#2f6b3f;--oks:#eaf4ec;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--red:#e2606b;--green:#93b597;--text:#e9eeeb;--muted:#9ba5a0;--line:#2d3531;--bg:#0e1210;--accs:rgba(226,96,107,.18);--glass:rgba(30,35,33,.55);--glass2:rgba(38,44,42,.85);--gbd:rgba(255,255,255,.09);--gsh:0 1px 0 rgba(255,255,255,.06) inset,0 12px 32px -14px rgba(0,0,0,.6);--ok:#8fd3a0;--oks:rgba(143,211,160,.12);color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body:before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(40% 36% at 6% 2%,rgba(182,36,50,.22),transparent 70%),radial-gradient(38% 40% at 98% 10%,rgba(128,158,132,.34),transparent 70%),radial-gradient(42% 40% at 72% 98%,rgba(232,145,58,.13),transparent 70%),radial-gradient(40% 36% at 16% 90%,rgba(201,138,143,.25),transparent 70%)}
header{position:sticky;top:0;z-index:5;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;background:var(--glass2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--gbd)}
header .lg{flex:0 0 42px;height:42px;border-radius:13px;background:var(--accs);display:grid;place-items:center}header .lg img{width:30px;height:30px}
header b{display:block;font-size:1.05rem;font-weight:700;color:var(--red);line-height:1.2}header small{display:block;color:var(--muted);font-size:.78rem}
#rel{margin-left:auto;border:1px solid var(--gbd);background:var(--glass2);color:var(--text);border-radius:12px;padding:8px 14px;font:600 .85rem Inter,sans-serif;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 12px -8px rgba(31,37,35,.3)}
main{max-width:820px;margin:0 auto;padding:22px 16px 60px}
.ptop{margin:0 2px 18px}.ptop h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-.01em}.ptop p{margin:2px 0 0;color:var(--muted);font-size:.88rem}.ptop p:first-letter{text-transform:uppercase}
.card,.pinbox,.kpi,.fc,.empty{background:var(--glass);border:1px solid var(--gbd);box-shadow:var(--gsh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.pinbox{border-radius:24px;padding:30px 22px;text-align:center;max-width:390px;margin:20px auto}
.pinbox .ico{width:54px;height:54px;border-radius:16px;background:var(--accs);display:grid;place-items:center;margin:0 auto;font-size:1.5rem}
.pinbox h1{font-size:1.3rem;font-weight:700;margin:14px 0 4px}.pinbox p{color:var(--muted);margin:0 0 16px;font-size:.9rem}
.pinbox input{width:100%;text-align:center;font:600 1.6rem/1 Inter,monospace;letter-spacing:.45em;padding:14px 10px;border:1px solid var(--line);border-radius:14px;outline:none;background:var(--glass2);color:var(--text)}
.pinbox input:focus,.act input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(128,158,132,.22)}.pinbox input::placeholder{letter-spacing:normal;font:400 1rem Inter,sans-serif;color:var(--muted)}
.pinbox button,.act button{border:0;border-radius:12px;color:#fff;font:600 1rem Inter,sans-serif;cursor:pointer;background:linear-gradient(180deg,#c73644,#a71f2c);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -8px rgba(182,36,50,.6)}
.pinbox button{width:100%;margin-top:12px;padding:14px}
.msg{min-height:1.2em;margin-top:10px;font-size:.88rem;color:var(--red)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.kpi{border-radius:16px;padding:14px 18px}.kpi small{display:block;color:var(--muted);font-size:.84rem;font-weight:500}
.kpi b{display:block;font-size:2rem;font-weight:700;letter-spacing:-.02em;color:#B5651D;line-height:1.15;margin-top:4px}.kpi.kg b{color:#4f7a56}.kpi span{color:var(--muted);font-size:.8rem}
@media(prefers-color-scheme:dark){.kpi b{color:#e6a35c}.kpi.kg b{color:#93b597}}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--glass);border:1px solid var(--gbd);box-shadow:var(--gsh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);margin-bottom:6px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font:600 .88rem Inter,sans-serif;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--glass2);color:var(--red);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 16px -8px rgba(182,36,50,.45)}
.day{display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:space-between;align-items:baseline;margin:24px 4px 10px;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4f7a56}.day span{font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);font-size:.82rem}
@media(prefers-color-scheme:dark){.day{color:var(--green)}}
.fc{border-radius:16px;padding:16px 18px;margin-bottom:12px;border-left:4px solid #E8913A}.fc.done{border-left-color:var(--green);opacity:.85}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.top b{font-size:1.02rem;font-weight:700}.top .imp{font-size:1.25rem;font-weight:700;white-space:nowrap;letter-spacing:-.01em}
.pr{color:var(--muted);font-size:.85rem}
dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 10px;margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:.92rem}
dt{color:var(--muted);font-size:.78rem;font-weight:500;padding-top:2px}dd{margin:0;word-break:break-word;-webkit-user-select:all;user-select:all}
dd.miss{color:var(--red);font-weight:600;-webkit-user-select:none;user-select:none}
.tags{margin-top:8px}.tags span{display:inline-block;background:#fff2d6;color:#8a5a12;border-radius:999px;padding:2px 10px;font-size:.76rem;font-weight:600;margin:4px 6px 0 0}.tags span.w{background:var(--accs);color:var(--red)}
@media(prefers-color-scheme:dark){.tags span{background:rgba(230,163,92,.16);color:#e6a35c}}
.cp{display:block;width:100%;margin-top:12px;border:1px solid var(--gbd);background:var(--glass2);color:var(--text);border-radius:12px;padding:10px;font:600 .9rem Inter,sans-serif;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 12px -8px rgba(31,37,35,.3)}
.cpt{display:none;width:100%;margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:10px;font:.85rem/1.5 monospace;resize:none;background:var(--glass2);color:var(--text)}
.act{display:flex;gap:8px;margin-top:10px}.act input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;outline:none;background:var(--glass2);color:var(--text)}
.act button{font-size:.92rem;padding:0 16px;white-space:nowrap}.act button:disabled,.ok button:disabled{opacity:.5}
.ok{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--oks);color:var(--ok);font-weight:600;font-size:.9rem}
.ok button{border:1px solid var(--gbd);background:var(--glass2);border-radius:10px;padding:6px 12px;font:600 .8rem Inter,sans-serif;color:var(--muted);cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:34px 10px;border-radius:16px;margin-top:16px}
.hint{color:var(--muted);font-size:.8rem;text-align:center;margin:10px 0 0}

<main><div class="ptop"><h1>Fatture da emettere</h1><p id="pdate"></p></div><div id="app"><p class="empty">Caricamento…</p></div></main><script>var FURL="https://script.google.com/macros/s/AKfycbw7WKsvPiN0_uy5awoiwJ2OD_GnftdAC7VvNghuCbbwYwIgeumOpLIsodJmaPiY3K_0aA/exec";
function rd(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
function wr(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k)}catch(e){}}
var KEY=((location.hash||"").match(/k=([0-9a-f]+)/)||[])[1]||rd("fkey"),PIN="",D=[],F="da";
if(KEY){wr("fkey",KEY);if(location.hash){try{history.replaceState(null,"",location.pathname)}catch(e){}}}
function api(o,ok,fail){var done=false,tm=setTimeout(function(){if(!done){done=true;fail({message:"La connessione è lenta: controlla internet e riprova."})}},30000);
 function fin(f,x){if(done)return;done=true;clearTimeout(tm);f(x)}
 var b={action:"fm",f:KEY,pin:PIN,op:o.op,id:o.id||"",num:o.num||"",em:!!o.em};
 fetch(FURL,{method:"POST",credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b),redirect:"follow"})
  .then(function(r){return r.json()}).then(function(x){if(x&&x.ok===false&&x.error&&!x.pin)return fin(fail,{message:x.error==="server_error"?"Errore del server: riprova tra poco.":x.error});fin(ok,x)})
  .catch(function(){fin(fail,{message:"Non riesco a collegarmi: controlla internet e riprova."})})}
var GG=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"],MM=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function eur(n){return (Math.round(n*100)/100).toFixed(2).replace(".",",")+" €"}
function dlab(s){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]),t=new Date();t.setHours(0,0,0,0);var df=Math.round((t-d)/864e5);
 var l=GG[d.getDay()]+" "+d.getDate()+" "+MM[d.getMonth()]+(d.getFullYear()!==t.getFullYear()?" "+d.getFullYear():"");l=l.charAt(0).toUpperCase()+l.slice(1);
 return df===0?"Oggi · "+l:df===1?"Ieri · "+l:l}
function pinForm(err){$("rel").style.display="none";
 $("app").innerHTML='<div class="pinbox"><div class="ico">🔒</div><h1>Inserisci il PIN</h1><p>Il codice di 6 cifre che ti ha dato Ilaria. Il telefono lo ricorderà per le prossime volte.</p><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="6 cifre"><button id="pgo" type="button">Entra</button><div class="msg">'+esc(err||"")+'</div></div>';
 $("pgo").onclick=function(){var v=$("pin").value.trim();if(v.length<6){$("pin").focus();return}PIN=v;this.disabled=true;this.textContent="Controllo…";load(true)};
 $("pin").onkeydown=function(e){if(e.key==="Enter")$("pgo").click()};$("pin").focus()}
function load(first){api({op:"dati"},function(r){if(!r.ok){wr("fpin","");return pinForm(first?"PIN non corretto.":"")}wr("fpin",PIN);D=r.righe;$("rel").style.display="";render()},function(e){pinForm(e.message)})}
var NL=String.fromCharCode(10);
function dmy(s){return String(s).split("-").reverse().join("/")}
function addr(r){return [r.ind,[r.cap,r.citta,r.prov?"("+r.prov+")":""].filter(Boolean).join(" ")].filter(Boolean).join(", ")}
function testo(r){var a=addr(r);return ["Paziente: "+r.nome,"Codice fiscale: "+(r.cf||"DA CHIEDERE"),"Indirizzo: "+(a||"DA CHIEDERE"),r.tel?"Telefono: "+r.tel:"",r.email?"Email: "+r.email:"",
 "Prestazione: "+(r.visita||"Visita nutrizionale"),"Data: "+dmy(r.data),"Importo: "+eur(r.importo),"Pagamento: POS (tracciabile)",r.bollo?"Marca da bollo: 2,00 €":"",
 "Sistema Tessera Sanitaria: "+(r.ts?"il paziente si OPPONE all'invio":"da inviare"),r.note?"Note: "+r.note:""].filter(Boolean).join(NL)}
function card(r){var a=addr(r),row=function(k,v,miss){if(!v&&!miss)return '';return '<dt>'+k+'</dt>'+(v?'<dd>'+esc(v)+'</dd>':(miss?'<dd class="miss">da chiedere al paziente</dd>':''))};
 var h='<div class="fc'+(r.fattura?" done":"")+'"><div class="top"><div><b>'+esc(r.nome)+'</b><div class="pr">'+esc(r.visita||"Visita nutrizionale")+'</div></div><div class="imp">'+eur(r.importo)+'</div></div><dl>'
  +row("Paziente",r.nome)+row("C.F.",r.cf,1)+row("Indirizzo",a,1)+row("Telefono",r.tel)+row("Email",r.email)
  +row("Prestazione",r.visita||"Visita nutrizionale")+row("Data",dmy(r.data))+row("Importo",eur(r.importo))+row("Pagamento","POS (tracciabile)")
  +row("Sistema TS",r.ts?"Il paziente si oppone all'invio":"Da inviare")+row("Note",r.note)+'</dl>';
 var tg=(r.bollo?'<span>Marca da bollo 2 €</span>':'')+(r.ts?'<span>Opposizione Sistema TS</span>':'')+(!r.cf||!a?'<span class="w">Mancano dati</span>':'');if(tg)h+='<div class="tags">'+tg+'</div>';
 h+='<button type="button" class="cp" data-c="'+esc(r.id)+'">📋 Copia tutti i dati</button><textarea class="cpt" readonly data-t="'+esc(r.id)+'"></textarea>';
 h+=r.fattura?'<div class="ok"><span>✓ Emessa'+(r.fattura!=="Emessa"?" · n. "+esc(r.fattura):"")+'</span><button type="button" data-u="'+esc(r.id)+'">Annulla</button></div>'
  :'<div class="act"><input placeholder="N. fattura (facoltativo)" data-n="'+esc(r.id)+'" autocomplete="off"><button type="button" data-s="'+esc(r.id)+'">✓ Emessa</button></div>';
 return h+'</div>'}
function copia(id,b){var r=D.filter(function(x){return x.id===id})[0];if(!r)return;var s=testo(r),ta=$("app").querySelector('textarea[data-t="'+id+'"]');
 function fatto(){b.textContent="✓ Dati copiati";setTimeout(function(){b.textContent="📋 Copia tutti i dati"},2500)}
 function manuale(){ta.value=s;ta.style.display="block";ta.style.height=(ta.scrollHeight+4)+"px";ta.focus();ta.select();try{ta.setSelectionRange(0,s.length)}catch(e){}
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}if(ok)fatto();else b.textContent="Tieni premuto sul testo e scegli Copia"}
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(fatto,manuale);return}}catch(e){}manuale()}
function render(){var da=D.filter(function(r){return !r.fattura}),em=D.filter(function(r){return r.fattura}),sum=function(l){return l.reduce(function(s,r){return s+r.importo},0)};
 var L=F==="da"?da:F==="em"?em:D,h='<div class="kpis"><div class="kpi"><small>Da emettere</small><b>'+da.length+'</b><span>'+eur(sum(da))+'</span></div><div class="kpi kg"><small>Emesse</small><b>'+em.length+'</b><span>ultimi 4 mesi</span></div></div>'
  +'<div class="seg"><button type="button" data-f="da"'+(F==="da"?' class="on"':'')+'>Da emettere</button><button type="button" data-f="em"'+(F==="em"?' class="on"':'')+'>Emesse</button><button type="button" data-f="tu"'+(F==="tu"?' class="on"':'')+'>Tutte</button></div>';
 if(!L.length)h+='<div class="empty">'+(F==="da"?"Nessuna fattura da emettere. 🎉":"Niente da mostrare.")+'</div>';
 var last="";L.forEach(function(r){if(r.data!==last){last=r.data;var g=L.filter(function(x){return x.data===r.data});h+='<div class="day">'+dlab(r.data)+'<span>'+g.length+(g.length===1?" pagamento":" pagamenti")+' · '+eur(sum(g))+'</span></div>'}h+=card(r)});
 if(L.length)h+='<p class="hint">Tocca un dato per selezionarlo e copiarlo.</p>';
 $("app").innerHTML=h}
function segna(id,num,em,b){var r=D.filter(function(x){return x.id===id})[0];if(!r)return;if(b){b.disabled=true;b.textContent="…"}
 api({op:"segna",id:id,num:num,em:em},function(x){if(!x.ok){if(x.pin){wr("fpin","");return pinForm("Inserisci di nuovo il PIN.")}alert(x.error);return render()}r.fattura=x.fattura;render()},function(e){if(b){b.disabled=false}pinForm(e.message)})}
$("app").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.c){copia(b.dataset.c,b);return}
 if(b.dataset.f){F=b.dataset.f;render();return}
 if(b.dataset.s){var i=$("app").querySelector('input[data-n="'+b.dataset.s+'"]');segna(b.dataset.s,i?i.value.trim():"",true,b);return}
 if(b.dataset.u){segna(b.dataset.u,"",false,b)}});
$("app").addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.n){var b=$("app").querySelector('button[data-s="'+e.target.dataset.n+'"]');if(b)b.click()}});
$("rel").onclick=function(){$("app").innerHTML='<p class="empty">Aggiornamento…</p>';load(false)};
if(!KEY){$("app").innerHTML='<div class="empty">Apri la pagina dall\'indirizzo <b>fatture.nutrizionistaiacone.it</b></div>'}
else{PIN=rd("fpin");if(PIN)load(false);else pinForm("")}
$("pdate").textContent=new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
